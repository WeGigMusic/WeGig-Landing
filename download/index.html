<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download WeGig</title>
  <script>
    const agent = navigator.userAgent;
    const isAndroid = /Android/i.test(agent);
    const isIPad = /Macintosh/i.test(agent) && navigator.maxTouchPoints > 1;
    const isIOS = /iPhone|iPad|iPod/i.test(agent) || isIPad;

    if (isAndroid) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.wegig.app");
    } else if (isIOS) {
      window.location.replace("https://apps.apple.com/app/id6778116125");
    }
  </script>
  <style>
    body { margin: 3rem auto; padding: 0 1rem; max-width: 32rem; font: 1rem system-ui, sans-serif; color: #fff; background: #111; }
    a { color: #fff; }
    li { margin: 0.75rem 0; }
  </style>
</head>
<body>
  <main>
    <h1>Download WeGig</h1>
    <ul>
      <li><a href="https://apps.apple.com/app/id6778116125">Download on the App Store</a></li>
      <li><a href="https://play.google.com/store/apps/details?id=com.wegig.app">Get it on Google Play</a></li>
    </ul>
  </main>
</body>
</html>
